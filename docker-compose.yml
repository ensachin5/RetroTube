services:
  retrotube:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: retrotube
    ports:
      - "${PORT:-3000}:3000"
    environment:
      YTDLP_PATH: /usr/local/bin/yt-dlp
      FFMPEG_PATH: /usr/bin/ffmpeg
      DB_PATH: /app/data/retrotube.db
      TEMP_DIR: /app/tmp
      MAX_CONCURRENT_JOBS: ${MAX_CONCURRENT_JOBS:-2}
      MAX_VIDEO_MINUTES: ${MAX_VIDEO_MINUTES:-0}
      MAX_FILE_SIZE_GB: ${MAX_FILE_SIZE_GB:-0}
      MIN_FREE_DISK_GB: ${MIN_FREE_DISK_GB:-2}
      FILE_TTL_MINUTES: ${FILE_TTL_MINUTES:-120}
      MAX_PLAYLIST_ITEMS: ${MAX_PLAYLIST_ITEMS:-200}
      BATCH_CONCURRENCY: ${BATCH_CONCURRENCY:-1}
      BATCH_ITEM_DELAY_MS: ${BATCH_ITEM_DELAY_MS:-1000}
      SERVER_SAVE_DIR: ${SERVER_SAVE_DIR:-}
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-3600}
      RATE_LIMIT_FETCH_PER_MIN: ${RATE_LIMIT_FETCH_PER_MIN:-20}
      RATE_LIMIT_DOWNLOAD_PER_MIN: ${RATE_LIMIT_DOWNLOAD_PER_MIN:-10}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      YTDLP_FETCH_TIMEOUT_MS: ${YTDLP_FETCH_TIMEOUT_MS:-30000}
      YTDLP_DOWNLOAD_TIMEOUT_MS: ${YTDLP_DOWNLOAD_TIMEOUT_MS:-1800000}
      YTDLP_CONCURRENT_FRAGMENTS: ${YTDLP_CONCURRENT_FRAGMENTS:-4}
      YTDLP_HTTP_CHUNK_SIZE: ${YTDLP_HTTP_CHUNK_SIZE:-10M}
      YTDLP_BUFFER_SIZE: ${YTDLP_BUFFER_SIZE:-16K}
      YTDLP_PROXY: ${YTDLP_PROXY:-}
      YTDLP_COOKIES_FILE: ${YTDLP_COOKIES_FILE:-}
      YTDLP_USE_ARIA2: ${YTDLP_USE_ARIA2:-false}
    volumes:
      - retrotube_data:/app/data
      - retrotube_tmp:/app/tmp
    restart: unless-stopped

# ==============================================================================
# Volume Sizing Guidance:
# - retrotube_data: Holds SQLite DB and format cache metadata (~100 MB to 1 GB).
# - retrotube_tmp: Holds in-flight audio/video streams, ffmpeg merges, and ZIP files.
#   Recommended size: At least 20 GB to 50 GB (or host NVMe bind mount) when downloading
#   high-resolution 4K/8K media or large playlists with multiple simultaneous items.
# ==============================================================================
volumes:
  retrotube_data:
  retrotube_tmp:
